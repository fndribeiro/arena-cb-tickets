name: codeql

# SAST on every commit: CodeQL security-extended queries for JavaScript/TypeScript.
# Alerts appear in the repository Security tab (Code scanning) and as a check on pull requests.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly re-scan picks up newly published CodeQL queries even without new commits.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - node_modules
              - migrations
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
